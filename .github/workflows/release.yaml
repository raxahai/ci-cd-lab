name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: build_automation/calc-app-maven
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: build_automation/calc-app-maven/pom.xml

      - name: Check tag matches pom version
        run: |
          POM_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pom: $POM_VERSION   tag: $TAG_VERSION"
          [ "$POM_VERSION" = "$TAG_VERSION" ] || { echo "Mismatch!"; exit 1; }

      - name: Build, test and publish to GitHub Packages
        run: ./mvnw -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" target/*.jar --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
