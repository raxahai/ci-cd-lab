name: CI

on:
  pull_request:
    branches: [main]

jobs:                           
  build:                        
    runs-on: ubuntu-latest      
    steps:                       
      - name: Get the code      
        uses: actions/checkout@v4
      - name: Install Java   
        uses: actions/setup-java@v4
        with:                
          distribution: temurin
          java-version: '21'
      - name: Build and test 
        run: ./mvnw -B verify
